# Aggiornamenti automatici delle dipendenze, raggruppati in una PR al mese.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-e-patch:
        update-types: [minor, patch]
    # Major updates (e.g. Vite, plugin-react, @types/node) are done by hand:
    # they often need code or runtime changes and fail as automatic PRs.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
